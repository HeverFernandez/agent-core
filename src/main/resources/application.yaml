spring:
  application:
    name: agent-core
    version: @project.version@

  # Configuración de base de datos PostgreSQL
  datasource:
#    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agent_db}
    url: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
    #    username: ${DB_USER:postgres}
    username: postgres.ixvxudzwskfgessmmwkv
#    password: ${DB_PASS:postgres}
    password: M0bc0zKjMB77i07l
    driver-class-name: org.postgresql.Driver

    # Connection Pool Configuration
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
#      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Supabase specific settings
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Supabase uses public schema by default
    schemas: public

  # (la configuración de logging se define más abajo; añadimos el nivel de Flyway allí)

#server:
#  port: ${SERVER_PORT:8080}
#  servlet:
#    context-path: /

# Configuración de OpenAPI/Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    use-root-path: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false

# Configuración de logging por defecto
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.aitamh.agent.core: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
    org.flywaydb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/agent-core.log
    max-size: 10MB
    max-history: 10

# Actuator configuration: expose health and info endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: ALWAYS
  health:
    db:
      enabled: true

